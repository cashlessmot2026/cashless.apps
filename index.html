    ];
    const CATEGORY_KEYS=['all','restaurant','mobility','commerce','hospitality','business'];
    const CATEGORY_FOR={ 'pwa-restaurants':'restaurant' };
    const TAG_TO_KEY={custom:'custom',mobile:'mobile',automation:'automation',payments:'payments',analytics:'analytics',booking:'booking',identity:'identity',loyalty:'loyalty',realtime:'realtime',nfc:'nfc',pwa:'pwa',marketplace:'marketplace',membership:'membership',routines:'routines',facial:'facial'};
    function App(){
      const [lang,setLang]=useState('es');
      const t=I18N[lang]||I18N.es;
      const [category,setCategory]=useState('all');
      const [query,setQuery]=useState('');
      const [mobileMenu,setMobileMenu]=useState(false);
      const [contactOpen,setContactOpen]=useState(false);
      const [selected,setSelected]=useState(null);
      const [dashboardOpen,setDashboardOpen]=useState(false);
      const [visitCount,setVisitCount]=useState(0);
      const [analytics,setAnalytics]=useState({visits:0,records:[]});
      const [toast,setToast]=useState('');
      const [clock,setClock]=useState(Date.now());
      useEffect(()=>{
        try{
          const key='cashless_colombia_portfolio_visits_v1'; const logKey='cashless_colombia_portfolio_country_log_v1';
          const n=(parseInt(localStorage.getItem(key)||'0',10)||0)+1;
          localStorage.setItem(key,String(n)); setVisitCount(n);
          const logs=JSON.parse(localStorage.getItem(logKey)||'[]');
          logs.unshift({date:new Date().toISOString(),country:'__pending__',countryCode:'',language:lang});
          localStorage.setItem(logKey,JSON.stringify(logs.slice(0,100)));
          setAnalytics({visits:n,records:logs.slice(0,100)});
          fetch('https://ipapi.co/json/').then(r=>{if(!r.ok)throw new Error('geo');return r.json()}).then(data=>{
            let latest=JSON.parse(localStorage.getItem(logKey)||'[]');
            if(latest.length){latest[0]={...latest[0],country:data.country_name||data.country||'—',countryCode:data.country_code||'',language:lang};localStorage.setItem(logKey,JSON.stringify(latest.slice(0,100)));setAnalytics({visits:Number(localStorage.getItem(key)||n),records:latest.slice(0,100)});}
          }).catch(()=>{
            let latest=JSON.parse(localStorage.getItem(logKey)||'[]');if(latest.length&&latest[0].country==='__pending__'){latest[0]={...latest[0],country:'—'};localStorage.setItem(logKey,JSON.stringify(latest.slice(0,100)));setAnalytics({visits:Number(localStorage.getItem(key)||n),records:latest.slice(0,100)});}
          });
        }catch(e){setVisitCount(1);setAnalytics({visits:1,records:[]});}
        const onKey=(e)=>{if(e.altKey&&e.shiftKey&&e.key.toLowerCase()==='c'){e.preventDefault();setDashboardOpen(v=>!v);refreshAnalytics();}};
        const onHash=()=>{if(window.location.hash==='#insights'){setDashboardOpen(true);refreshAnalytics();}};
        window.addEventListener('keydown',onKey);window.addEventListener('hashchange',onHash);if(window.location.hash==='#insights')setDashboardOpen(true);
        return()=>{window.removeEventListener('keydown',onKey);window.removeEventListener('hashchange',onHash)};
      },[]);
      useEffect(()=>{document.documentElement.lang=lang;document.title=`Cashless Colombia — ${lang==='es'?'Productos digitales':lang==='fr'?'Produits numériques':lang==='it'?'Prodotti digitali':lang==='pt'?'Produtos digitais':lang==='el'?'Ψηφιακά προϊόντα':'Digital products'}`},[lang]);
      useEffect(()=>{if(!toast)return;const timer=setTimeout(()=>setToast(''),2600);return()=>clearTimeout(timer)},[toast]);
      function refreshAnalytics(){try{setAnalytics({visits:Number(localStorage.getItem('cashless_colombia_portfolio_visits_v1')||'0'),records:JSON.parse(localStorage.getItem('cashless_colombia_portfolio_country_log_v1')||'[]')});}catch(e){setAnalytics({visits:0,records:[]})}}
      const categories=CATEGORY_KEYS.map(k=>[k,t.filters[k]]);
      const filtered=useMemo(()=>PROJECTS.filter(p=>{const c=p.copy[lang]||p.copy.es;const matchesCat=category==='all'||p.category===category;const q=query.trim().toLowerCase();const matchesQuery=!q||c.join(' ').toLowerCase().includes(q)||p.tags.some(tag=>(t.tags[TAG_TO_KEY[tag]]||tag).toLowerCase().includes(q));return matchesCat&&matchesQuery}),[lang,category,query,t]);
      const countryCounts=useMemo(()=>{const counts={};analytics.records.forEach(r=>{if(r.country&&r.country!=='__pending__'&&r.country!=='—')counts[r.country]=(counts[r.country]||0)+1});return Object.entries(counts).sort((a,b)=>b[1]-a[1])},[analytics]);
      function openContact(){setContactOpen(true);setSelected(null)}
      function exportCSV(){const rows=[['date','country','countryCode','language'],...analytics.records.map(r=>[r.date,r.country,r.countryCode||'',r.language||''])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='cashless-colombia-analytics.csv';a.click();URL.revokeObjectURL(url);setToast(t.dashExported)}
      function clearLocal(){try{localStorage.removeItem('cashless_colombia_portfolio_visits_v1');localStorage.removeItem('cashless_colombia_portfolio_country_log_v1');setVisitCount(0);setAnalytics({visits:0,records:[]});setToast(t.dashCleared)}catch(e){}}
      const chosen=selected?PROJECTS.find(p=>p.id===selected):null;
      const categoryName=(key)=>t.filters[key]||t.filters.all;
      return <>
        <header className="topbar"><div className="wrap nav">

          <nav className={'navlinks '+(mobileMenu?'open':'')}>
            <a href="#soluciones" onClick={()=>setMobileMenu(false)}>{t.nav.services}</a><a href="#proceso" onClick={()=>setMobileMenu(false)}>{t.nav.process}</a><a href="#tecnologia" onClick={()=>setMobileMenu(false)}>{t.nav.about}</a><a href="#contacto" onClick={()=>{setMobileMenu(false);}}>{t.nav.contact}</a>
          </nav>

        </div></header>
        <main>

          </div></section>
          <section className="stats-strip"><div className="wrap stats-grid"><div className="stat"><div className="stat-icon">⌘</div><div><strong>{t.stat1v}</strong><span>{t.stat1}</span></div></div><div className="stat"><div className="stat-icon">◈</div><div><strong>{t.stat2v}</strong><span>{t.stat2}</span></div></div><div className="stat"><div className="stat-icon">⌁</div><div><strong>{t.stat3v}</strong><span>{t.stat3}</span></div></div><div className="stat"><div className="stat-icon">◎</div><div><strong>{t.stat4v}</strong><span>{t.stat4}</span></div></div></div></section>
          <section className="section" id="soluciones"><div className="wrap"><div className="section-head"><div><div className="section-kicker">{t.portfolioKicker}</div><h2>{t.portfolioTitle}</h2><p className="section-desc">{t.portfolioDesc}</p></div><label className="search"><span>⌕</span><input type="search" value={query} onChange={e=>setQuery(e.target.value)} placeholder={t.searchPlaceholder} aria-label={t.searchLabel}/></label></div><div className="filters">{categories.map(([key,label])=><button key={key} className={'filter '+(category===key?'active':'')} onClick={()=>setCategory(key)}>{label}</button>)}</div><div className="portfolio-grid">{filtered.map(p=>{const copy=p.copy[lang]||p.copy.es;return <article className="project-card" key={p.id} style={{'--glow':p.glow,'--iconbg':p.iconbg}} onClick={()=>setSelected(p.id)} role="button" tabIndex="0" onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setSelected(p.id)}}} aria-label={copy[0]}><div className="project-image-wrap"><img className="project-image" src={p.image} alt={copy[0]} loading="lazy" onError={e=>{e.currentTarget.style.display='none'}} /></div><div className="project-top"><div className="project-arrow">↗</div></div><div className="project-category">{categoryName(p.category)}</div><h3>{copy[0]}</h3><p>{copy[1]}</p><div className="card-bottom">{p.tags.slice(0,3).map(tag=><span className="tag" key={tag}>{t.tags[TAG_TO_KEY[tag]]||tag}</span>)}</div></article>})}{filtered.length===0&&<div className="empty">{t.empty}</div>}</div></div></section>

          <section className="section" id="tecnologia"><div className="wrap feature-band"><div><div className="section-kicker">{t.techKicker}</div><h2>{t.techTitle}</h2><p className="feature-copy">{t.techDesc}</p></div><div className="feature-list">{t.features.map((f,i)=><div className="feature-item" key={f}><span className="check">✓</span><span>{f}</span></div>)}</div></div></section>
          <section className="section" id="contacto"><div className="wrap"><div className="cta"><div><h2>{t.ctaTitle}</h2><p>{t.ctaDesc}</p></div><button className="button" onClick={openContact}>{t.ctaButton} <span>↗</span></button></div></div></section>
        </main>
        <footer className="footer"><div className="wrap"><div className="footer-inner"><a className="brand" href="#inicio"><span className="brand-mark">CC</span><span>CASHLESS <span style={{color:'var(--lime)'}}>COLOMBIA</span><small>{t.footerTag}</small></span></a><div className="footer-location"><span>⌖</span><span>{t.location}</span></div><div className="footer-copy">{t.developer}</div><div className="social-links" aria-label="Redes sociales"><a href="https://www.instagram.com/cashless_colombia?psln=Y2J2M3NndzJvamRn" target="_blank" rel="noopener noreferrer">◎ Instagram ↗</a><a href="https://www.tiktok.com/@cashlesscolombia?_r=1&_t=ZS-9Ay9kMykc3m" target="_blank" rel="noopener noreferrer">♪ TikTok ↗</a></div></div><div className="footer-bottom"><span>© {new Date().getFullYear()} Cashless Colombia. {t.rights}</span><span>{t.visits}: <strong style={{color:'var(--lime)'}}>{visitCount.toLocaleString(lang==='el'?'el-GR':lang==='fr'?'fr-FR':lang==='it'?'it-IT':lang==='pt'?'pt-BR':lang==='en'?'en-US':'es-CO')}</strong></span></div></div></footer>
        <button className="wa-float" onClick={openContact} aria-label={t.ariaContact} title={t.waLabel}><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16.04 3C8.9 3 3.1 8.79 3.1 15.93c0 2.28.6 4.5 1.74 6.47L3 29l6.77-1.78a12.9 12.9 0 0 0 6.26 1.6h.01c7.14 0 12.94-5.8 12.94-12.94A12.84 12.84 0 0 0 16.04 3zm0 23.65c-1.95 0-3.86-.52-5.52-1.5l-.4-.24-4.02 1.06 1.07-3.92-.26-.4a10.7 10.7 0 0 1-1.65-5.72c0-5.93 4.83-10.76 10.77-10.76 2.87 0 5.57 1.12 7.6 3.15a10.68 10.68 0 0 1 3.16 7.61c0 5.93-4.83 10.76-10.75 10.76zm5.9-8.06c-.32-.16-1.9-.94-2.2-1.05-.3-.11-.51-.16-.73.16-.21.32-.83 1.05-1.02 1.27-.19.21-.38.24-.7.08-.32-.16-1.35-.5-2.57-1.6-.95-.85-1.6-1.9-1.79-2.22-.19-.32-.02-.5.14-.66.14-.14.32-.38.48-.56.16-.19.21-.32.32-.54.11-.21.06-.4-.03-.56-.08-.16-.73-1.76-1-2.41-.27-.63-.54-.54-.73-.55h-.62c-.21 0-.56.08-.86.4-.3.32-1.13 1.1-1.13 2.68s1.16 3.1 1.32 3.31c.16.21 2.28 3.48 5.52 4.88.77.33 1.37.53 1.84.68.77.24 1.47.21 2.02.13.62-.09 1.9-.78 2.17-1.53.27-.75.27-1.4.19-1.53-.08-.14-.3-.22-.62-.38z"/></svg></button><div className="wa-tip">{t.waLabel}</div>
        {contactOpen&&<div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget)setContactOpen(false)}}><section className="modal" role="dialog" aria-modal="true" aria-labelledby="contact-title"><button className="modal-close" onClick={()=>setContactOpen(false)} aria-label={t.close}>×</button><div className="modal-icon">💬</div><h2 id="contact-title">{t.contactsTitle}</h2><p>{t.contactsDesc}</p>{CONTACTS.map((c,i)=><div className="contact-choice" key={c.number}><div><strong>{c.name||t.waLabel}</strong><small>+57 {c.number}</small><small>{c.location}</small></div><a className="wa-link" href={'https://wa.me/'+c.wa+'?text='+encodeURIComponent(lang==='es'?'Hola, vi su portafolio digital y quiero conocer más.':lang==='fr'?'Bonjour, j’ai vu votre portfolio numérique et je souhaite en savoir plus.':lang==='it'?'Ciao, ho visto il vostro portfolio digitale e vorrei saperne di più.':lang==='pt'?'Olá, vi o portfólio digital e gostaria de saber mais.':lang==='el'?'Γεια σας, είδα το ψηφιακό σας portfolio και θα ήθελα να μάθω περισσότερα.':'Hello, I saw your digital portfolio and would like to know more.')} target="_blank" rel="noopener noreferrer">{t.waAction} ↗</a></div>)}<div className="modal-actions"><button className="button secondary" onClick={()=>setContactOpen(false)}>{t.close}</button></div></section></div>}
        {chosen&&<div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget)setSelected(null)}}><section className="modal" role="dialog" aria-modal="true" aria-labelledby="project-title"><button className="modal-close" onClick={()=>setSelected(null)} aria-label={t.close}>×</button><img className="modal-project-image" src={chosen.image} alt={(chosen.copy[lang]||chosen.copy.es)[0]} onError={e=>{e.currentTarget.style.display='none'}}/><div className="modal-icon">{chosen.icon}</div><div className="project-category">{categoryName(chosen.category)}</div><h2 id="project-title">{(chosen.copy[lang]||chosen.copy.es)[0]}</h2><p>{(chosen.copy[lang]||chosen.copy.es)[1]}</p><h3 style={{fontSize:'1rem',letterSpacing:'-.02em',marginBottom:8}}>{t.moreFeatures}</h3><div className="details-bullets">{t.detailItems.map((item,i)=><div key={i}><span style={{color:'var(--lime)'}}>✓</span><span>{item}</span></div>)}</div><div className="card-bottom">{chosen.tags.map(tag=><span className="tag" key={tag}>{t.tags[TAG_TO_KEY[tag]]||tag}</span>)}</div><div className="modal-actions"><button className="button primary" onClick={openContact}>{t.ctaPrimary} ↗</button><button className="button secondary" onClick={()=>setSelected(null)}>{t.close}</button></div></section></div>}
        {dashboardOpen&&<div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget)setDashboardOpen(false)}}><section className="modal dashboard" role="dialog" aria-modal="true" aria-labelledby="dash-title"><div className="dash-head"><div><div className="section-kicker">{t.privacy}</div><h2 id="dash-title">{t.dashTitle}</h2><p>{t.dashSubtitle}</p></div><button className="modal-close" onClick={()=>setDashboardOpen(false)} aria-label={t.close}>×</button></div><div className="dash-grid"><div className="dash-stat"><span>{t.dashVisits}</span><strong>{analytics.visits}</strong></div><div className="dash-stat"><span>{t.dashCountries}</span><strong>{countryCounts.length}</strong></div><div className="dash-stat"><span>{t.dashLast}</span><strong style={{fontSize:'1rem',marginTop:8}}>{analytics.records[0]?.date?new Date(analytics.records[0].date).toLocaleString():'—'}</strong></div></div><div className="dash-actions"><button className="mini-btn" onClick={exportCSV}>{t.dashExport}</button><button className="mini-btn" onClick={refreshAnalytics}>{t.dashRefresh}</button><button className="mini-btn" onClick={clearLocal}>{t.dashClear}</button></div><div style={{overflowX:'auto'}}><table className="dash-table"><thead><tr><th>{t.dashCountry}</th><th>{t.dashLanguage}</th><th>{t.dashDate}</th></tr></thead><tbody>{analytics.records.filter(r=>r.country!=='—').slice(0,15).map((r,i)=><tr key={i}><td>{r.country==='__pending__'?t.dashDetecting:r.country||'—'} {r.countryCode?`(${r.countryCode})`:''}</td><td>{(r.language||'—').toUpperCase()}</td><td>{r.date?new Date(r.date).toLocaleString():'—'}</td></tr>)}</tbody></table>{analytics.records.filter(r=>r.country!=='—').length===0&&<p style={{padding:'16px 6px',fontSize:'.82rem'}}>{t.dashEmpty}</p>}</div><div className="dash-note">{t.dashNote}<br/><br/><strong>{t.dashShortcut}</strong> <code>#insights</code></div><div className="modal-actions"><button className="button secondary" onClick={()=>setDashboardOpen(false)}>{t.dashClose}</button></div></section></div>}
        {toast&&<div className="toast" role="status">{toast}</div>}
      </>;
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
